# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: study-hub-api
    runtime: docker
    plan: free
    region: singapore  # closest Render region to the Supabase DB (Tokyo)
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_USER_ID
        sync: false
